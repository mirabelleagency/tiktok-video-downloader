<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src https://www.googleapis.com https://sheets.googleapis.com;">
  <title>TikTok Video Downloader</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container" role="main" aria-label="TikTok Video Downloader Extension">
    <!-- Header -->
    <header class="header" role="banner">
      <div class="logo">
        <div class="logo-icon" aria-hidden="true">
          <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M34.1451 0H26.0556V32.6956C26.0556 36.5913 22.9444 39.7913 19.0726 39.7913C15.2007 39.7913 12.0895 36.5913 12.0895 32.6956C12.0895 28.8696 15.1315 25.7391 18.8651 25.6V17.3913C10.6373 17.5304 4 24.2783 4 32.6956C4 41.1826 10.7757 48 19.1419 48C27.508 48 34.2837 41.1131 34.2837 32.6956V15.8261C37.3257 18.0522 41.059 19.3739 45 19.4435V11.2348C38.9171 10.9565 34.1451 6.01739 34.1451 0Z" fill="white"/>
          </svg>
        </div>
        <div class="header-text">
          <h1>TikTok Downloader</h1>
          <span class="version" id="popup-version">v1.1.0</span>
        </div>
      </div>
    </header>

    <!-- Auth Section (shown when not logged in) -->
    <section id="auth-section" class="section auth-section" role="region" aria-label="Authentication">
      <div class="auth-message">
        <p>Sign in with Google to start downloading videos</p>
      </div>
      <button id="sign-in-btn" class="btn btn-primary btn-large" aria-label="Sign in with Google account">
        <svg class="google-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
        Sign in with Google
      </button>
    </section>

    <!-- Main Section (shown when logged in) -->
    <section id="main-section" class="section main-section hidden" role="region" aria-label="Download Controls">
      <!-- Status Bar -->
      <div class="status-bar" role="status" aria-live="polite">
        <span class="status-indicator online" aria-hidden="true"></span>
        <span id="status-text">Ready</span>
      </div>

      <!-- Quick Actions -->
      <div class="quick-actions" role="group" aria-label="Quick actions">
        <button id="download-current-btn" class="btn btn-primary" title="Download video from current tab" aria-label="Download video from current TikTok tab">
          <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          Download Current
        </button>
      </div>

      <!-- Progress Section (hidden by default) -->
      <div id="progress-section" class="progress-section hidden" role="region" aria-label="Download progress" aria-live="polite">
        <div class="progress-header">
          <span id="progress-status" role="status">Downloading...</span>
          <button id="cancel-btn" class="btn btn-icon-only btn-small" title="Cancel download" aria-label="Cancel current download">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16" aria-hidden="true">
              <line x1="18" y1="6" x2="6" y2="18"/>
              <line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
        </div>
        <div class="progress-bar-container" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100" aria-label="Download progress">
          <div id="progress-bar" class="progress-bar" style="width: 0%"></div>
        </div>
        <div class="progress-details">
          <span id="progress-percentage" aria-label="Percentage complete">0%</span>
          <span id="progress-size" aria-label="Download size"></span>
        </div>
      </div>

      <!-- Stats Card -->
      <div class="stats-card" role="group" aria-label="Download statistics">
        <div class="stat">
          <span id="total-downloads" class="stat-value" aria-label="Total downloads">0</span>
          <span class="stat-label">Downloads</span>
        </div>
        <div class="stat">
          <span id="total-uploads" class="stat-value" aria-label="Total uploads to Drive">0</span>
          <span class="stat-label">Uploads</span>
        </div>
        <button id="clear-stats-btn" class="btn btn-icon-only btn-small" title="Clear statistics" aria-label="Clear all download statistics">
          <svg class="btn-icon-small" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M3 6h18"/>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/>
            <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
          </svg>
        </button>
      </div>

      <!-- Recent Activity -->
      <div class="recent-activity" role="region" aria-label="Recent download activity">
        <h3 id="activity-heading">Recent Activity</h3>
        <div id="activity-list" class="activity-list" role="list" aria-labelledby="activity-heading">
          <p class="empty-state" role="listitem">No downloads yet</p>
        </div>
      </div>

      <!-- Footer Actions -->
      <nav class="footer-actions" role="navigation" aria-label="Additional actions">
        <button id="open-drive-btn" class="btn btn-link" title="Open Google Drive folder" aria-label="Open TikTok Downloads folder in Google Drive">
          <svg class="btn-icon-small" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
            <polyline points="15 3 21 3 21 9"/>
            <line x1="10" y1="14" x2="21" y2="3"/>
          </svg>
          Drive
        </button>
        <button id="open-sheets-btn" class="btn btn-link" title="Open Google Sheets log" aria-label="Open download log in Google Sheets">
          <svg class="btn-icon-small" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
            <line x1="3" y1="9" x2="21" y2="9"/>
            <line x1="9" y1="21" x2="9" y2="9"/>
          </svg>
          Sheets
        </button>
        <button id="open-settings-btn" class="btn btn-link" title="Open Settings" aria-label="Open extension settings">
          <svg class="btn-icon-small" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
          Settings
        </button>
        <button id="sign-out-btn" class="btn btn-icon-only btn-danger" title="Sign out" aria-label="Sign out from Google account">
          <svg class="btn-icon-small" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
        </button>
      </nav>
    </section>

    <!-- Loading Overlay -->
    <div id="loading-overlay" class="loading-overlay hidden" role="alert" aria-live="assertive" aria-busy="true">
      <div class="spinner" aria-hidden="true"></div>
      <span id="loading-text">Loading...</span>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
