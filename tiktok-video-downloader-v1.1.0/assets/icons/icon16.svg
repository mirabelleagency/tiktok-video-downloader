      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
  </defs>
  <rect width="48" height="48" rx="8" fill="url(#bgGrad)"/>
  
  <!-- Play button circle -->
  <circle cx="24" cy="21" r="14" fill="#00d4aa"/>
  
  <!-- Play triangle -->
  <path d="M20 14 L32 21 L20 28 Z" fill="#1a1a2e"/>
  
  <!-- Download arrow stem -->
  <rect x="22" y="30" width="4" height="6" fill="#ffffff"/>
  
  <!-- Download arrow head -->
  <path d="M18 36 L30 36 L24 44 Z" fill="#ffffff"/>
  
  <!-- Download base line -->
